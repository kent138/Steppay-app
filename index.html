<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Тест кнопок</title>
    <style>
        button { padding: 10px 20px; margin: 10px; font-size: 16px; }
        .panel { background: #f0f0f0; padding: 20px; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<h1>Тест кнопок МАТРЁШКА</h1>

<button onclick="openMenu()">⋮ Три точки</button>

<div id="dropdown" style="display:none; background:white; border:1px solid #ccc; padding:10px; position:absolute">
    <button onclick="requestAccess()">Редактировать каталог</button>
</div>

<div id="passwordModal" style="display:none; background:rgba(0,0,0,0.5); position:fixed; top:0; left:0; right:0; bottom:0">
    <div style="background:white; padding:20px; margin:100px auto; width:300px">
        <input type="password" id="passwordInput" placeholder="Пароль">
        <button onclick="checkPass()">Войти</button>
        <p id="errorMsg" style="color:red; display:none">Неверный пароль</p>
    </div>
</div>

<div id="adminPanel" style="display:none; background:white; border:2px solid red; padding:20px; margin-top:20px">
    <h2>АДМИНКА РАБОТАЕТ! 🎉</h2>
    <button onclick="closeAdmin()">Закрыть</button>
</div>

<script>
    function openMenu() {
        var dropdown = document.getElementById('dropdown');
        dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        alert('Меню открыто!');
    }
    
    function requestAccess() {
        document.getElementById('dropdown').style.display = 'none';
        document.getElementById('passwordModal').style.display = 'block';
        alert('Запрос доступа! Введите пароль 7316');
    }
    
    function checkPass() {
        var pass = document.getElementById('passwordInput').value;
        if (pass === '7316') {
            document.getElementById('passwordModal').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            alert('Пароль верный! Админка открыта');
        } else {
            document.getElementById('errorMsg').style.display = 'block';
            alert('Неверный пароль');
        }
    }
    
    function closeAdmin() {
        document.getElementById('adminPanel').style.display = 'none';
        alert('Админка закрыта');
    }
    
    alert('✅ Тестовый файл загружен! Нажмите на кнопки.');
</script>

</body>
</html>
