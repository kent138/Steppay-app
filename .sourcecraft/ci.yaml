on:
  push:
    - workflows: [deploy-api]
      filter:
        branches: ["main"]
        paths: ["api/**"]

tokens:
  default-token:
    service_connection: default-service-connection
    scope: ref

workflows:
  deploy-api:
    tasks:
      - name: deploy-api-task
        cubes:
          - name: get-iam-token
            env:
              ID_TOKEN: ${{ tokens.default-token.id_token }}
              YC_SA_ID: ${{ tokens.default-token.service_account_id }}
            image: cr.yandex/sourcecraft/yc-iam:latest

          - name: check-and-create-function
            env:
              YC_IAM_TOKEN: ${{ cubes.get-iam-token.outputs.IAM_TOKEN }}
              YC_FOLDER_ID: ${{ tokens.default-token.folder_id }}
              YC_FUNCTION_NAME: "matroshka-store-api"
            image:
              name: cr.yandex/sourcecraft/yc-cli:latest
              entrypoint: ""
            script:
              - |
                yc config set folder-id $YC_FOLDER_ID
                echo "Checking if function exists..."
                if ! yc serverless function get --name=$YC_FUNCTION_NAME; then
                  echo "Function does not exist. Creating new function..."
                  yc serverless function create --name=$YC_FUNCTION_NAME
                else
                  echo "Function already exists."
                fi

          - name: deploy-function-version
            env:
              YC_IAM_TOKEN: ${{ cubes.get-iam-token.outputs.IAM_TOKEN }}
              YC_FOLDER_ID: ${{ tokens.default-token.folder_id }}
              YC_FUNCTION_NAME: "matroshka-store-api"
              YC_FUNCTION_RUNTIME: "nodejs22"
              YC_FUNCTION_ENTRYPOINT: "index.handler"
              SOURCE_PATH: "./api"
            image:
              name: cr.yandex/sourcecraft/yc-cli:latest
              entrypoint: ""
            script:
              - mkdir -p ./tmp
              - cp "$SOURCE_PATH"/*.js* ./tmp
              - cp "$SOURCE_PATH"/package.json ./tmp 2>/dev/null || true
              - echo "Deploying new function version..."
              - |
                yc config set folder-id $YC_FOLDER_ID
                yc serverless function version create \
                  --function-name=$YC_FUNCTION_NAME \
                  --runtime $YC_FUNCTION_RUNTIME \
                  --entrypoint $YC_FUNCTION_ENTRYPOINT \
                  --execution-timeout 10s \
                  --source-path ./tmp

          - name: make-bucket-public
            env:
              YC_IAM_TOKEN: ${{ cubes.get-iam-token.outputs.IAM_TOKEN }}
              YC_FOLDER_ID: ${{ tokens.default-token.folder_id }}
            image:
              name: cr.yandex/sourcecraft/yc-cli:latest
              entrypoint: ""
            script:
              - |
                yc config set folder-id $YC_FOLDER_ID
                BUCKET_NAME="matroshka-products-store"
                
                # Make bucket public for reading and writing
                echo "Making bucket $BUCKET_NAME publicly accessible..."
                yc storage bucket update --name=$BUCKET_NAME \
                  --public-read \
                  --public-list

          - name: make-function-public
            env:
              YC_IAM_TOKEN: ${{ cubes.get-iam-token.outputs.IAM_TOKEN }}
              YC_FOLDER_ID: ${{ tokens.default-token.folder_id }}
              YC_FUNCTION_NAME: "matroshka-store-api"
            image:
              name: cr.yandex/sourcecraft/yc-cli:latest
              entrypoint: ""
            script:
              - |
                yc config set folder-id $YC_FOLDER_ID
                echo "Making function public..."
                yc serverless function allow-unauthenticated-invoke --name=$YC_FUNCTION_NAME
